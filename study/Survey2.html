{% extends "global/Page.html" %}
{% load otree static %}

{% block title %}
Survey Two.
{% endblock %}

{% block content %}

<style>
    /* No visible page timer during the test. The page still has a hidden
       safety time limit (page_timeouts['survey2_test']) in case it gets stuck. */
    .otree-timer,
    .otree-timer.alert {
        display: none !important;
    }

    /* Prevent selecting the shown sequence (helps reduce manual copying). */
    #display-box {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }
</style>

<input type="hidden" name="digitspan_max_level" id="digitspan_max_level" value="0">

<div id="display-box" style="font-size:2em; height:2em; margin:1.5em 0;">Get ready…</div>

<div id="input-block" style="display:none; margin-bottom:1em;">
    <input id="response" type="number" inputmode="numeric" pattern="[0-9]*"
           autocomplete="off" style="font-size:1.5em; width:6em;">
</div>

{% endblock %}

{% block scripts %}
<script>
(function(){

    const sequences = [
        ['17','63'],['582','694'],['6439','7286'],['42731','75836'],
        ['619473','392487'],['5917428','4179386'],['58192647','38295174'],
        ['275862584','713942568']
    ];

    const disp     = document.getElementById('display-box'),
          inputBlk = document.getElementById('input-block'),
          resp     = document.getElementById('response'),
          maxField = document.getElementById('digitspan_max_level'),
          form     = document.getElementById('form');

    let level = 0, stage = 0, correctCount = 0, phase = 'show';
    let inputTimer = null;
    let finished = false;

    function saveState() {
        try {
            sessionStorage.setItem('ds_state', JSON.stringify({ level, stage, correctCount, phase }));
        } catch (e) {}
    }
    function clearState() {
        try { sessionStorage.removeItem('ds_state'); } catch (e) {}
    }

    function startInputTimer() {
        clearInputTimer();
        const INPUT_TIME_LIMIT = sequences[level][stage].length * 1500;
        inputTimer = setTimeout(submitResponse, INPUT_TIME_LIMIT);
    }

    function clearInputTimer() {
        if (inputTimer !== null) {
            clearTimeout(inputTimer);
            inputTimer = null;
        }
    }

    function showInput() {
        disp.textContent = '';
        inputBlk.style.display = 'block';
        resp.value = '';
        resp.focus();
        phase = 'input';
        saveState();
        startInputTimer();
    }

    function showTrial() {
        inputBlk.style.display = 'none';
        const currentSequence = sequences[level][stage];
        disp.textContent = currentSequence;
        phase = 'show';
        saveState();
        setTimeout(showInput, currentSequence.length * 500);
    }

    function submitResponse() {
        clearInputTimer();
        inputBlk.style.display = 'none';

        if (resp.value.trim() === sequences[level][stage]) {
            correctCount++;
        }

        stage++;

        if (stage < 2) {
            showTrial();
        } else if (correctCount > 0 && level < sequences.length - 1) {
            level++;
            stage = 0;
            correctCount = 0;
            showTrial();
        } else {
            finishTask();
        }
    }

    // Test finished: store the result and go on to the end-of-test page.
    function finishTask() {
        if (finished) return;
        finished = true;
        maxField.value = (level + 1);
        disp.textContent = '';
        clearState();
        form.submit();
    }

    // Resume after a page reload, otherwise start a fresh test.
    let saved = null;
    try { saved = JSON.parse(sessionStorage.getItem('ds_state')); } catch (e) {}

    if (saved) {
        level = saved.level ?? 0;
        stage = saved.stage ?? 0;
        correctCount = saved.correctCount ?? 0;
        if (saved.phase === 'input') {
            showInput();
        } else {
            showTrial();
        }
    } else {
        setTimeout(showTrial, 1000);
    }

    // Disable Enter (it would submit the page)
    document.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            e.preventDefault();
        }
    });

    // Disable copy/cut/paste + common keyboard shortcuts
    ['copy', 'cut', 'paste'].forEach(evt => {
        document.addEventListener(evt, (e) => {
            e.preventDefault();
        });
    });

    document.addEventListener('keydown', (e) => {
        const key = (e.key || '').toLowerCase();
        if ((e.ctrlKey || e.metaKey) && (key === 'c' || key === 'v' || key === 'x')) {
            e.preventDefault();
        }
    });

})();
</script>
{% endblock %}
